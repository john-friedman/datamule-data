name: Generate CIK-CUSIP Mapping

on:
  schedule:
    - cron: '0 6 * * *'  # 12 AM Eastern
  workflow_dispatch:  # For manual runs

# Give the workflow permission to push to the repository
permissions:
  contents: write

jobs:
  generate-cusip-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: master

      - uses: actions/checkout@v4
        with:
          ref: scripts
          path: .scripts
          persist-credentials: false
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython
          pip install datamule --no-build-isolation
      
      - name: Create datasets directory
        run: mkdir -p data/datasets
      
      - name: Run CIK-CUSIP mapping script
        env:
          DATAMULE_API_KEY: ${{ secrets.DATAMULE_API_KEY }}
        run: python -u .scripts/code/cik-cusips/construct-cik-cusip-mapping.py
      
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- data/datasets/cik_cusip_crosswalk.csv.gz
          if ! git diff --cached --quiet; then
            git commit -m "Update CIK-CUSIP mapping data - $(date)"
            git push origin HEAD:master
          fi
