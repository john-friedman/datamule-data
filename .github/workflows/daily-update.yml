name: Generate Data

on:
  schedule:
    - cron: '0 9 * * *'  # 4 AM Eastern (9 UTC)
  workflow_dispatch:  # For manual runs

# Give the workflow permission to push to the repository
permissions:
  contents: write

concurrency:
  group: datamule-data-master
  queue: max
  cancel-in-progress: false

jobs:
  generate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: master

      - uses: actions/checkout@v4
        with:
          ref: scripts
          path: .scripts
          persist-credentials: false
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython
          pip install datamule --no-build-isolation
      
      - name: Run generate-data script
        run: python -u .scripts/code/generate-data.py
      
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- data/ updates.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate data update"
            git push origin HEAD:master
          fi
