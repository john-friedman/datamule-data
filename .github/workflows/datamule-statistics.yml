name: datamule-statistics

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datamule-data-master
  queue: max
  cancel-in-progress: false

jobs:
  filing-detections-speed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - uses: actions/checkout@v4
        with:
          ref: scripts
          path: .scripts
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/john-friedman/datamule-hub.git@master" "polars==1.41.1"

      - name: Generate filing detection statistics
        env:
          DATAMULE_API_KEY: ${{ secrets.DATAMULE_API_KEY }}
        run: python -u .scripts/code/datamule_statistics.py

      - name: Commit statistics
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- \
            data/datamule-statistics/filing-detections-speed/fastest_sec_filings_websocket.parquet \
            data/datamule-statistics/filing-detections-speed/websocket.parquet \
            data/datamule-statistics/filing-detections-speed/linked_filings.parquet
          if ! git diff --cached --quiet; then
            git commit -m "Update filing detection statistics"
            git push origin HEAD:master
          fi
